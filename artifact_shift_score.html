<script>
/* light is the default theme; set it before the page paints so a dark device doesn't flash dark first */
(function () { var m = "light"; try { m = localStorage.getItem("shiftscore-theme") || "light"; } catch (e) {}
  if (m === "light" || m === "dark") document.documentElement.setAttribute("data-theme", m); })();
</script>

<style>

  --muted: #5b6b74;
  --line: #d9e1e4;
  --accent: #1c5d8c;
  --accent-ink: #ffffff;
  --rail: #eef2f3;
  --good: #1a7f4e;
  --bad: #b1372e;
  --font-display: 'Oswald', 'Arial Narrow', sans-serif;
  --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1518; --surface: #161f23; --ink: #e7edef; --muted: #90a1a8;
    --line: #28353a; --accent: #5aa3d6; --accent-ink: #06141c; --rail: #1a2327;
    --good: #4fbf85; --bad: #e2766c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1518; --surface: #161f23; --ink: #e7edef; --muted: #90a1a8;
  --line: #28353a; --accent: #5aa3d6; --accent-ink: #06141c; --rail: #1a2327;
  --good: #4fbf85; --bad: #e2766c; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  margin: 0; padding: 0 16px; padding-block: 0;
}
.wrap { max-width: 1040px; margin: 0 auto; min-width: 0; }

header.masthead {
  padding-top: calc(28px + env(safe-area-inset-top, 0px));
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}
.masthead-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 6vw, 40px);
  letter-spacing: 0.01em; margin: 0; text-transform: uppercase; text-wrap: balance;
}
h1 span { color: var(--accent); }
.season-tag {

}
.masthead-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.season-select { min-width: 0; padding: 6px 10px; font-family: var(--font-mono); font-size: 12.5px; }

}

nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 5;
  display: flex; gap: 4px; overflow-x: auto; padding: 14px 0 10px;

}
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  font-family: var(--font-display); font-weight: 600; font-size: 13.5px;
  letter-spacing: 0.03em; text-transform: uppercase;
  background: var(--rail); color: var(--muted); border: 1px solid transparent;
  border-radius: 7px; padding: 9px 14px; cursor: pointer; white-space: nowrap;
  transition: background .12s, color .12s;
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.panel { display: none; padding: 20px 0 48px; }
.panel.active { display: block; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.panel-title { font-family: var(--font-display); font-weight: 600; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
.panel-caption { color: var(--muted); font-size: 13.5px; max-width: 64ch; line-height: 1.5; margin-top: 4px; }
.search {
  font-family: var(--font-body); font-size: 13.5px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink);
  min-width: 180px;
}
.search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
thead th {
  text-align: left; font-family: var(--font-display); font-weight: 600; font-size: 11.5px;

  position: sticky; top: 0; background: var(--surface);
}
tbody td { padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--rail); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 12.5px; }
td.rank { color: var(--muted); font-family: var(--font-mono); font-size: 12px; width: 1%; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.empty { padding: 32px 12px; text-align: center; color: var(--muted); font-size: 13.5px; }
.loading { padding: 32px 12px; text-align: center; color: var(--muted); font-size: 13.5px; }

tr.clickable { cursor: pointer; }
a.row-link { color: var(--accent); text-decoration: none; cursor: pointer; }

.back-btn {
  font-family: var(--font-display); font-weight: 600; font-size: 12.5px; letter-spacing: .03em;
  text-transform: uppercase; background: none; border: none; color: var(--accent);
  cursor: pointer; padding: 0 0 14px; display: block;
}
.detail-title {
  font-family: var(--font-display); font-weight: 600; font-size: 22px; text-transform: uppercase;
  letter-spacing: .02em; margin: 0 0 4px;
}
.detail-sub { color: var(--muted); font-weight: 400; font-size: 15px; text-transform: none; letter-spacing: 0; }
.detail-h3 {
  font-family: var(--font-display); font-weight: 600; font-size: 14px; text-transform: uppercase;
  letter-spacing: .03em; color: var(--muted); margin: 22px 0 8px;
}

.prose { max-width: 74ch; font-size: 14.5px; line-height: 1.6; }
.prose h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .03em; margin: 26px 0 6px; }
.prose p { margin: 0 0 10px; }
.prose code { font-family: var(--font-mono); font-size: 12.5px; background: var(--rail); padding: 1px 6px; border-radius: 4px; }
.prose .formula { display: block; padding: 10px 14px; margin: 8px 0 12px; overflow-x: auto; white-space: nowrap; }
.prose .table-scroll { margin: 8px 0 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
.chip {
  font-family: var(--font-display); font-weight: 600; font-size: 12.5px; letter-spacing: .03em; text-transform: uppercase;
  background: var(--rail); color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gv-filters { margin: 14px 0 4px; }
.gv-stars { margin: 0 0 0 18px; padding: 0; font-size: 13.5px; line-height: 1.7; }
.live-badge { display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--rail); color: var(--muted); border: 1px solid var(--line); }
.live-badge.on { background: var(--bad); color: #fff; border-color: var(--bad); }
.live-badge.on::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #fff; animation: livepulse 1.4s ease-in-out infinite; }
@keyframes livepulse { 50% { opacity: .25; } }
nav.tabs button.has-live { color: var(--bad); }
nav.tabs button.has-live[aria-selected="true"] { color: var(--accent-ink); }
.live-meta { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; font-family: var(--font-mono); }
.live-warn { background: var(--rail); border: 1px solid var(--bad); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px; }
.live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.live-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.live-card.clickable:hover { border-color: var(--accent); }
.live-status { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.live-teams { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; }
.live-sub { color: var(--muted); font-size: 12.5px; margin-top: 8px; font-family: var(--font-mono); }
.live-goal { color: var(--muted); font-size: 12px; margin-top: 3px; }
.kicker { color: var(--muted); font-size: 13px; }

footer {
  padding: 18px 0 calc(28px + env(safe-area-inset-bottom, 0px));
  color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); margin-top: 8px;
  line-height: 1.6;
}
footer a { color: var(--accent); }

@media (max-width: 480px) {
  thead th, tbody td { padding: 7px 9px; }
  h1 { font-size: 26px; }
}

/* ================= Ice & rink theme (overrides the base styles above) =================
   Concept: a printed box score on rink ice. Navy "boards" for table heads and score strips,
   the red center line as the one accent the eye follows, rink-blue for links and filters.
   Square corners and ruled sections instead of rounded cards. */
:root {
  --bg: #e8eff6;
  --surface: #fbfdff;
  --ink: #0c2038;
  --muted: #4b5f78;
  --line: #c3d2e0;
  --accent: #0a4a9e;
  --accent-ink: #ffffff;
  --rail: #d8e5f0;
  --red: #c8102e;
  --good: #137a4b;
  --bad: #c8102e;
  --board: #0c2038;
  --board-ink: #eaf3fb;
  --stripe: rgba(10, 74, 158, 0.045);
  --crease: #cfe6f8;
  --sheen: rgba(255, 255, 255, 0.75);
  --font-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07121d; --surface: #0d1c2b; --ink: #e6eff7; --muted: #8fa4ba; --line: #1f3449;
    --accent: #5aa7ff; --accent-ink: #04111d; --rail: #12263a; --red: #ff5d73; --good: #4cc790; --bad: #ff6b7c;
    --board: #091623; --board-ink: #dbe8f4; --stripe: rgba(90, 167, 255, 0.05); --crease: #123a58;
    --sheen: rgba(90, 167, 255, 0.07); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07121d; --surface: #0d1c2b; --ink: #e6eff7; --muted: #8fa4ba; --line: #1f3449;
  --accent: #5aa7ff; --accent-ink: #04111d; --rail: #12263a; --red: #ff5d73; --good: #4cc790; --bad: #ff6b7c;
  --board: #091623; --board-ink: #dbe8f4; --stripe: rgba(90, 167, 255, 0.05); --crease: #123a58;
  --sheen: rgba(90, 167, 255, 0.07); color-scheme: dark;
}

body {
  background-color: var(--bg);
  background-image:
    radial-gradient(1100px 420px at 88% -8%, var(--sheen), transparent 65%),
    repeating-linear-gradient(104deg, transparent 0 150px, var(--stripe) 150px 151px);
  font-size: 15px;
}

/* masthead: face-off circle and a dashed red center line */
header.masthead { position: relative; overflow: hidden; border-bottom: 0; padding-bottom: 22px; }
header.masthead::before {
  content: ""; position: absolute; right: -34px; top: 50%; width: 176px; height: 176px; transform: translateY(-48%);
  border: 3px solid var(--red); border-radius: 50%; opacity: 0.32; pointer-events: none;
  background: radial-gradient(circle, var(--red) 0 8px, transparent 9px);
}
header.masthead::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; pointer-events: none;
  background: repeating-linear-gradient(90deg, var(--red) 0 16px, transparent 16px 21px);
}
.masthead-row, .sub { position: relative; z-index: 1; }
h1 { font-weight: 900; font-size: clamp(38px, 8vw, 60px); letter-spacing: 0.015em; line-height: 0.95; }
h1 span { color: var(--red); }
.season-tag { font-size: 13.5px; letter-spacing: 0.02em; }
.sub { font-size: 15.5px; max-width: 56ch; color: var(--ink); opacity: 0.82; }

/* tabs: ruled board tabs, not pills */
nav.tabs { gap: 0; padding: 8px 0 0; border-bottom: 2px solid var(--ink); }
nav.tabs button {
  font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: 0.07em;
  background: transparent; color: var(--muted); border: 0; border-bottom: 4px solid transparent;
  border-radius: 0; padding: 10px 14px 8px; margin-bottom: -2px;
}
nav.tabs button:hover { color: var(--ink); background: var(--crease); }
nav.tabs button[aria-selected="true"] { background: transparent; color: var(--ink); border-bottom-color: var(--red); }
nav.tabs button.has-live { color: var(--red); }
nav.tabs button.has-live[aria-selected="true"] { color: var(--red); }
nav.tabs button:focus-visible, .chip:focus-visible, .search:focus-visible, a.row-link:focus-visible, .back-btn:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* panel heads */
.panel-title { font-weight: 900; font-size: 30px; letter-spacing: 0.02em; line-height: 1; }
.panel-caption { color: var(--muted); font-size: 14px; max-width: 70ch; }
.search { border: 1.5px solid var(--ink); border-radius: 2px; background: var(--surface); font-family: var(--font-body); font-size: 14px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.season-select { font-family: var(--font-mono); font-weight: 500; }

/* tables: navy header band, quiet stripes, hairline rows */
.table-scroll { border: 1.5px solid var(--ink); border-radius: 2px; background: var(--surface); box-shadow: 3px 3px 0 var(--line); }
thead th {
  background: var(--board); color: var(--board-ink); border-bottom: 0;
  font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.09em; padding: 9px 12px;
}
tbody td { border-bottom: 1px solid var(--line); padding: 7px 12px; }
tbody tr:nth-child(even) td { background: var(--stripe); }
tbody tr:hover td { background: var(--crease); }
td.num, th.num { font-family: var(--font-mono); font-weight: 500; font-size: 15px; }
td.rank { font-family: var(--font-mono); }
a.row-link { color: var(--accent); font-weight: 500; text-decoration: none; border-bottom: 1px solid transparent; }
a.row-link:hover { text-decoration: none; border-bottom-color: var(--accent); }
.pos { color: var(--good); }
.neg { color: var(--bad); }

/* detail pages */
.back-btn { font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: 0.08em; color: var(--accent); padding: 4px 0 12px; }
.back-btn:hover { color: var(--red); }
.detail-title { font-weight: 900; font-size: clamp(30px, 6vw, 46px); letter-spacing: 0.015em; line-height: 1; margin-bottom: 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.detail-sub { font-family: var(--font-body); font-weight: 400; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--muted); }
.detail-h3 {
  font-weight: 800; font-size: 17px; letter-spacing: 0.08em; color: var(--ink);
  margin: 30px 0 10px; padding-bottom: 4px; border-bottom: 2px solid var(--ink);
}

/* filters: square tags, navy when on */
.chips { gap: 4px; }
.chip {
  font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: 0.07em;
  background: var(--surface); color: var(--muted); border: 1.5px solid var(--ink); border-radius: 2px; padding: 5px 12px;
}
.chip:hover { color: var(--ink); background: var(--crease); }
.chip[aria-pressed="true"] { background: var(--board); color: var(--board-ink); border-color: var(--board); }
.gv-filters { margin: 16px 0 6px; }
.gv-stars { font-size: 14.5px; }

/* live: scoreboard strips */
.live-badge { border-radius: 2px; background: var(--rail); color: var(--ink); border-color: var(--ink); font-weight: 800; letter-spacing: 0.08em; }
.live-badge.on { background: var(--red); color: #fff; border-color: var(--red); }
.live-grid { gap: 14px; }
.live-card { padding: 0; border: 1.5px solid var(--ink); border-radius: 2px; overflow: hidden; box-shadow: 3px 3px 0 var(--line); }
.live-card.clickable:hover { border-color: var(--red); box-shadow: 3px 3px 0 var(--red); }
.live-status { background: var(--board); color: var(--board-ink); margin: 0; padding: 7px 12px; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.live-status .live-badge { border-color: transparent; background: var(--rail); }
.live-status .live-badge.on { background: var(--red); }
.live-teams { padding: 6px 12px 0; font-weight: 900; font-size: 30px; letter-spacing: 0.03em; }
.live-sub { padding: 0 12px; margin-top: 10px; }
.live-goal { padding: 0 12px; }
.live-card > :last-child { padding-bottom: 12px; }
.live-warn { border-radius: 2px; border-width: 1.5px; }

/* score ticker: a slim, day-browsable strip of scores under the tabs on every tab except Home */
.ticker { display: flex; align-items: stretch; gap: 10px; margin: 0 0 16px; }
.ticker[hidden] { display: none; }
.tk-head { flex: none; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 112px; }
.tk-date { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); line-height: 1.15; }
.tk-date small { display: block; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; text-transform: none; font-size: 12px; }
.tk-ctrls { display: flex; gap: 6px; }
.tk-btn { appearance: none; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); width: 30px; height: 26px; border-radius: 2px; cursor: pointer; font-size: 17px; line-height: 1; padding: 0; }
.tk-btn.wide { width: auto; padding: 0 8px; font-size: 11.5px; font-family: var(--font-display); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.tk-btn:hover:not(:disabled) { border-color: var(--red, var(--accent)); }
.tk-btn:disabled { opacity: 0.4; cursor: default; }
.tk-strip { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.tk-game { flex: 0 0 auto; min-width: 124px; scroll-snap-align: start; appearance: none; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--ink); border-radius: 2px; padding: 0; cursor: pointer; overflow: hidden; box-shadow: 2px 2px 0 var(--line); display: flex; flex-direction: column; }
.tk-game:hover { border-color: var(--red, var(--accent)); box-shadow: 2px 2px 0 var(--red, var(--accent)); }
.tk-status { background: var(--board); color: var(--board-ink); padding: 3px 9px; font-family: var(--font-display); font-weight: 700; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.tk-game.live .tk-status { background: var(--red, var(--bad)); color: #fff; }
.tk-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 9px 0; font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: 0.03em; }
.tk-row:last-child { padding-bottom: 6px; }
.tk-row .tlogo { width: 20px; height: 20px; }
.tk-row b { font-weight: 900; }
@media (max-width: 560px) { .ticker { flex-direction: column; gap: 6px; } .tk-head { flex-direction: row; align-items: center; justify-content: space-between; min-width: 0; } }
.tk-empty { align-self: center; color: var(--muted); font-size: 13.5px; padding: 0 6px; }

/* how it works */
.prose h3 { font-weight: 800; font-size: 18px; letter-spacing: 0.08em; border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin: 30px 0 10px; }
.prose code { background: var(--rail); border-radius: 2px; font-family: var(--font-mono); font-size: 14px; }
.prose .formula { border-left: 4px solid var(--red); }
.empty, .loading { color: var(--muted); }

.board-chips { margin: 2px 0 18px; }
.board-head { margin-bottom: 14px; }
.board-title { font-family: var(--font-display); font-weight: 900; font-size: 30px; letter-spacing: 0.02em; line-height: 1; text-transform: uppercase; margin-bottom: 6px; }

footer { border-top: 2px solid var(--ink); color: var(--muted); font-size: 13px; }
@media (max-width: 480px) {
  h1 { font-size: 40px; }
  header.masthead::before { width: 130px; height: 130px; right: -40px; }
  nav.tabs button { padding: 9px 11px 7px; font-size: 15px; }
  .panel-title { font-size: 26px; }

  header.masthead { padding-bottom: 54px; }
  .masthead-tools { flex-direction: row; align-items: center; }
  nav.tabs { margin-left: 4px; margin-right: 4px; max-width: calc(100% - 8px); }
  nav.tabs button { padding: 8px 13px; }
}
@media (prefers-reduced-motion: reduce) { nav.tabs button.has-live::before { animation: none; } }

/* ================= Readability pass =================
   Type is scaled up from the original (tables 13.5 -> 15px, numbers 15 -> 16px, captions 14 -> 16px) with roomier rows and a
   slightly wider page. A first pass went larger (16/17px); this is the middle. */
.wrap { max-width: 1160px; }
body { font-size: 16px; line-height: 1.55; }
.sub { font-size: 17px; line-height: 1.55; max-width: 58ch; }
.season-tag { font-size: 14px; }
.season-select { font-size: 14px; padding: 7px 12px; }
nav.tabs button { font-size: 16px; padding: 9px 18px; }

.panel { padding-bottom: 56px; }
.panel-title, .board-title { font-size: 34px; }
.panel-caption { font-size: 16px; line-height: 1.55; max-width: 72ch; margin-top: 6px; }
.search { font-size: 15px; padding: 10px 18px; min-width: 220px; }
.chip { font-size: 15px; padding: 7px 16px; }
.board-groups .chip { padding-left: 22px; padding-right: 22px; }
.kicker, .scroll-hint, .live-meta { font-size: 14px; }
.empty, .loading { font-size: 15px; padding: 40px 14px; }

table { font-size: 15px; width: auto; }
/* tables are only as wide as their columns need, so values sit next to their headings instead of floating apart */
.table-scroll { width: fit-content; max-width: 100%; }
thead th { font-size: 13px; letter-spacing: 0.08em; padding: 12px 18px; }
tbody td { padding: 11px 18px; }
td.num, th.num { font-size: 16px; }
td.rank { font-size: 14px; }
.sort-arrow { font-size: 12px; }
.avatar { width: 40px; height: 40px; margin-right: 11px; font-size: 14px; line-height: 40px; }
.avatar-lg { width: 124px; height: 124px; margin-right: 20px; font-size: 38px; line-height: 124px; border-width: 3px; }
.tlogo { width: 1.75em; height: 1.18em; }
.rank-tag { font-size: 0.84em; }
.tbar { height: 9px; min-width: 100px; }

.back-btn { font-size: 15px; padding-bottom: 14px; }
.detail-title { font-size: clamp(32px, 6vw, 50px); }
.detail-sub { font-size: 17px; }
.detail-h3 { font-size: 20px; margin-top: 44px; }
.board-sub { font-size: 15px; }
.gv-group { font-size: 18px; margin-top: 38px; }
.gv-details-title { font-size: 19px; }
.gv-stars { font-size: 16px; line-height: 1.75; }
.gv-verdict { font-size: 19px; }
.gv-expected { font-size: 15.5px; }
.gv-ot-result { font-size: 16px; }
.gv-map figcaption, .gv-keys { font-size: 15px; }
.gv-wp { height: 30px; font-size: 14px; }
.gv-player-pick, .toi-slider, .team-stat-pick { font-size: 15px; }
.gv-tip { font-size: 13.5px; max-width: 260px; }
.gv-tip strong { font-size: 14.5px; }
.home-date { font-size: 15px; padding: 8px 14px; }
.lb-sub { font-size: 17px; margin-bottom: 8px; }
.lb-sec { margin-bottom: 36px; }

/* wide tables scroll sideways on a phone: the player / team name column stays put while the numbers slide under it */
.sort-scroll td:first-child, .sort-scroll th:first-child { position: sticky; left: 0; z-index: 1; background-color: var(--surface); }
.sort-scroll thead th:first-child { z-index: 3; background-color: var(--board); }
.sort-scroll tbody tr:nth-child(even) td:first-child { background-image: linear-gradient(var(--stripe), var(--stripe)); }
.sort-scroll tbody tr:hover td:first-child { background-color: var(--crease); background-image: none; }
@media (max-width: 700px) {
  .sort-scroll td:first-child { box-shadow: 6px 0 8px -6px rgba(10, 31, 61, 0.35); white-space: normal; min-width: 128px; max-width: 150px; line-height: 1.25; padding-right: 8px; }
  .sort-scroll td:first-child .avatar { display: none; }
}

/* game tiles and the score ticker */
.live-status { font-size: 15px; padding: 11px 18px; }
.live-teams { font-size: 34px; }
.live-sub { font-size: 15px; }
.live-goal { font-size: 14px; margin-top: 4px; }
.live-warn { font-size: 15px; }
.live-badge { font-size: 12.5px; padding: 3px 9px; }
.live-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.tk-date { font-size: 14px; }
.tk-date small { font-size: 13px; }
.tk-btn { width: 34px; height: 30px; font-size: 18px; }
.tk-btn.wide { font-size: 12.5px; }
.tk-game { min-width: 138px; }
.tk-status { font-size: 12.5px; padding: 3px 10px; }
.tk-row { font-size: 19px; padding: 4px 10px 0; }
.tk-row:last-child { padding-bottom: 7px; }
.tk-row .tlogo { width: 23px; height: 23px; }
.tk-empty { font-size: 15px; }

/* player card */
.player-card { padding: 22px 26px 16px; }
.pc-name { font-size: 28px; }
.pc-sub { font-size: 15px; }
.pc-stats { gap: 22px; }
.pc-stats div { min-width: 50px; }
.pc-stats b { font-size: 24px; }
.pc-stats span { font-size: 12px; }
.pc-small { font-size: 14.5px; padding: 9px 13px; }
.pc-group { font-size: 13px; margin: 18px 0 5px; }
.pc-row { font-size: 15.5px; padding: 5px 0; min-height: 36px; grid-template-columns: minmax(130px, 1.1fr) 1.5fr 60px; }
.pc-track { height: 11px; }
.pc-dot { min-width: 28px; height: 28px; font-size: 12.5px; }
.pc-bars { grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }

/* how it works */
.prose { font-size: 17px; line-height: 1.65; max-width: 76ch; }
.prose h3 { font-size: 21px; }
.prose code { font-size: 15px; }
footer { font-size: 14px; }

/* team page: header, key numbers with league rank, section tabs */
.tlogo-lg { width: 96px; height: 72px; margin-right: 0; }
.team-head { display: flex; align-items: center; gap: 18px; margin: 4px 0 18px; }
.team-head .detail-title { margin: 0; }
.team-record { color: var(--muted); font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.team-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 0 0 22px; }
.team-tile { display: flex; flex-direction: column; gap: 2px; padding: 14px 18px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 10px 26px -20px rgba(10, 31, 61, 0.5); }
.tt-label { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tt-val { font-family: var(--font-display); font-weight: 800; font-size: 36px; line-height: 1.05; letter-spacing: 0.01em; }
.tt-rank { font-size: 14px; color: var(--muted); }
.team-nav { margin: 0 0 6px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; border-bottom: 1px solid var(--line); }
.team-nav .chip { flex: 0 0 auto; }
.team-section > .detail-h3:first-child { margin-top: 26px; }
.team-section .two-up .detail-h3 { margin-top: 26px; }
.team-all { margin: 22px 0 6px; }
.team-all > summary { cursor: pointer; font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); padding: 6px 0 12px; }
.team-all[open] > summary { color: var(--ink); }

/* team stats and league rank: three equal cards, a rank pill beside each value */
.stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; align-items: start; margin: 4px 0 8px; }
@media (min-width: 1040px) { .stat-cards { grid-template-columns: 1fr 1.45fr 1fr; } }
.stat-card { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 12px 30px -20px rgba(10, 31, 61, 0.5); padding: 6px 0 8px; overflow: hidden; }
.stat-card h4 { margin: 0; padding: 14px 20px 12px; font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink); border-bottom: 2px solid var(--line); }
.sr { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.sr:last-child { border-bottom: 0; }
.sr:nth-child(even) { background: var(--stripe); }
.sr-l { flex: 1 1 auto; min-width: 0; }
.sr-v { flex: none; min-width: 104px; display: flex; align-items: center; justify-content: flex-end; gap: 9px; font-variant-numeric: tabular-nums; }
.sr-v b { font-size: 17px; font-weight: 700; }
.sr-none { color: var(--muted); }
.sr-head { background: transparent !important; padding-top: 8px; padding-bottom: 6px; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sr-head .sr-v { min-width: 104px; }
.rk { display: inline-block; min-width: 42px; text-align: center; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--rail); color: var(--muted); }
.rk-top { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.rk-low { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
@media (max-width: 480px) { .sr { padding: 10px 14px; gap: 10px; } .stat-card h4 { padding: 12px 14px 10px; } .sr-v { min-width: 0; } .sr-head .sr-v { min-width: 0; } }

/* trend charts and goalie start grades */
.trend { margin: 6px 0 4px; padding: 14px 18px 10px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 12px 30px -20px rgba(10, 31, 61, 0.5); }
.trend figcaption { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.tr-svg { display: block; width: 100%; height: auto; }
.tr-grid { stroke: var(--line); stroke-width: 1; }
.tr-letter { fill: var(--muted); font-size: 12px; font-weight: 700; font-family: var(--font-body); }
.tr-base { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.tr-axis { fill: var(--muted); font-size: 12.5px; font-family: var(--font-body); }
.tr-line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.tr-dot { fill: color-mix(in srgb, var(--accent) 70%, transparent); stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
.tr-dot.tr-lost { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.tr-dot:hover, .tr-bar:hover { stroke: var(--ink); stroke-width: 2; }
.tr-bar { fill: var(--gbg); cursor: pointer; }
.tr-bar.tr-relief { opacity: 0.5; }
.tr-key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 14px; color: var(--muted); padding: 2px 0 4px; }
.tr-note { flex: 1 1 100%; font-size: 13.5px; }
.tr-k::before { content: ""; display: inline-block; vertical-align: -2px; margin-right: 6px; }
.tr-k-dot::before { width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 70%, transparent); }
.tr-k-hollow::before { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); }
.tr-k-line::before { width: 22px; height: 3px; border-radius: 2px; background: var(--accent); vertical-align: 3px; }
.g-great { --gbg: var(--good); --gfg: var(--surface); }
.g-quality { --gbg: color-mix(in srgb, var(--good) 40%, var(--surface)); --gfg: var(--ink); }
.g-average { --gbg: color-mix(in srgb, var(--muted) 45%, var(--surface)); --gfg: var(--ink); }
.g-bad { --gbg: color-mix(in srgb, var(--bad) 40%, var(--surface)); --gfg: var(--ink); }
.g-blown { --gbg: var(--bad); --gfg: var(--surface); }
.grade { display: inline-block; padding: 2px 11px; border-radius: 999px; font-size: 13.5px; font-weight: 700; background: var(--gbg); color: var(--gfg); }
.grade-tag { font-size: 13px; color: var(--muted); margin-left: 4px; white-space: nowrap; }
.tt-val.pos { color: var(--good); }
.tt-val.neg { color: var(--bad); }
@media (max-width: 480px) { .trend { padding: 12px 10px 8px; } }

/* game page: one compact filter bar */
.gv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 4px 0 8px; }
.gv-bar .chips, .gv-bar .gv-teampick { margin: 0; }
.gv-sel { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--muted); }
.gv-sel span { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.gv-sel select { padding: 7px 34px 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; max-width: 100%; }
@media (max-width: 480px) { .gv-bar { gap: 8px; } .gv-sel { flex: 1 1 45%; } .gv-sel select { flex: 1; min-width: 0; } }
/* game page: head-to-head team stats */
.gv-split { align-items: start; }
.gv-split > div > .detail-h3:first-child { margin-top: 26px; }
.cmp { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 12px 30px -20px rgba(10, 31, 61, 0.5); padding: 4px 20px 12px; }
.cmp-head { display: grid; grid-template-columns: 5.5em 1fr 5.5em; padding: 12px 0 4px; font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: 0.06em; }
.cmp-head span:last-child, .cmp-row .cmp-v:nth-of-type(2) { text-align: right; }
.cmp-head span:first-child::before, .cmp-head span:last-child::after { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: 0; }
.cmp-head span:first-child::before { margin-right: 8px; background: var(--accent); }
.cmp-head span:last-child::after { margin-left: 8px; background: color-mix(in srgb, var(--muted) 55%, var(--surface)); }
.cmp-group { margin: 12px 0 2px; padding-top: 8px; border-top: 1px solid var(--line); font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.cmp-head + .cmp-group { border-top: 0; margin-top: 4px; }
.cmp-row { display: grid; grid-template-columns: 5.5em 1fr 5.5em; align-items: baseline; padding: 6px 0 0; font-size: 15.5px; }
.cmp-l { text-align: center; color: var(--muted); }
.cmp-v { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 16.5px; }
.cmp-bar { grid-column: 1 / -1; height: 5px; margin-top: 4px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 55%, var(--surface)); overflow: hidden; }
@media (max-width: 480px) { .cmp { padding: 4px 14px 12px; } .cmp-head, .cmp-row { grid-template-columns: 3.4em 1fr 3.4em; } .cmp-row { font-size: 14.5px; } }
.cmp-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px 0 0 99px; }

.gv-units { grid-template-columns: 1fr; }
.faces { display: inline-flex; vertical-align: middle; margin-right: 12px; }
.faces .avatar { width: 34px; height: 34px; margin: 0 0 0 -10px; line-height: 34px; font-size: 12px; border: 2px solid var(--surface); box-sizing: content-box; }
.faces .avatar:first-child { margin-left: 0; }
tbody tr:nth-child(even) .faces .avatar { border-color: color-mix(in srgb, var(--surface) 96%, var(--accent)); }
/* game page: shot danger, one card with a row per team and a split bar under it */
.dz-wrap { overflow-x: auto; }
.dz { min-width: 520px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 12px 30px -20px rgba(10, 31, 61, 0.5); padding: 4px 8px 8px; --dz-cols: 1.1fr repeat(var(--dz-n), 1fr); }
.dz-head, .dz-team { display: grid; grid-template-columns: var(--dz-cols); align-items: center; column-gap: 8px; }
.dz-head { padding: 12px 12px 8px; border-bottom: 1px solid var(--line); }
.dz-h { text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.dz-h small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12.5px; letter-spacing: 0; text-transform: none; color: var(--muted); }
.dz-team { padding: 14px 12px 8px; }
.dz-team + .dz-team { border-top: 1px solid var(--line); }
.dz-sub { display: block; font-family: var(--font-body); font-weight: 400; font-size: 13px; letter-spacing: 0; color: var(--muted); margin-top: 2px; }
.dz-name { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: 0.03em; }
.dz-c { text-align: center; line-height: 1.15; padding: 8px 4px; border-radius: 12px; }
.dz-c.over { background: color-mix(in srgb, var(--good) var(--sh), transparent); }
.dz-c.under { background: color-mix(in srgb, var(--bad) var(--sh), transparent); }
.dz-key i { display: inline-block; width: 12px; height: 12px; margin: 0 6px 0 10px; border-radius: 4px; vertical-align: -1px; }
.dz-key i.over { background: color-mix(in srgb, var(--good) 40%, transparent); }
.dz-key i.under { background: color-mix(in srgb, var(--bad) 40%, transparent); }
.dz-c b { display: block; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
.dz-c small.dz-gap { margin-top: 3px; font-size: 12.5px; font-weight: 700; min-height: 1.1em; }
.dz-c.over small.dz-gap { color: var(--good); }
.dz-c.under small.dz-gap { color: var(--bad); }
.dz-c small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dz .h { color: var(--bad); }
.dz .m { color: var(--accent); }
.dz .l { color: var(--muted); }
.dz .e { color: var(--muted); }
.dz .t { color: var(--ink); }
@media (max-width: 480px) { .dz-name { font-size: 20px; } .dz-c b { font-size: 24px; } }

/* address row on detail pages: back button and copy link */
.detail-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.copy-link { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; cursor: pointer; }
.copy-link:hover { background: var(--crease); color: var(--ink); }
.theme-toggle { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--board-ink); background: transparent; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
.theme-toggle:hover { background: rgba(255, 255, 255, 0.14); }
/* home: stars of the night and standings */
.home-extras { margin-top: 12px; align-items: start; }
.stars { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }
.star { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 10px 12px; text-align: center; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 12px 30px -20px rgba(10, 31, 61, 0.5); cursor: pointer; color: var(--ink); text-decoration: none; }
.star:hover { border-color: var(--accent); }
.star .avatar-lg { width: 76px; height: 76px; line-height: 76px; margin: 0 0 4px; font-size: 24px; }
.star-name { font-weight: 700; font-size: 16px; line-height: 1.2; }
.star-team { color: var(--muted); font-size: 14px; }
.star-adj { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.star-raw { color: var(--muted); font-size: 13px; }
.star-team small { color: var(--muted); font-size: 12.5px; margin-left: 2px; }
.star-grade { margin-top: 2px; }
.home-night-rows > div + div { margin-top: 18px; }
/* home: latest results and season leaders */
.res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.res { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "teams tag"; align-items: center; gap: 8px 12px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 12px 30px -20px rgba(10, 31, 61, 0.5); color: var(--ink); text-decoration: none; cursor: pointer; }
.res:hover { border-color: var(--accent); }
.res-teams { grid-area: teams; display: grid; gap: 4px; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: 0.03em; }
.res-teams > span { display: flex; align-items: center; color: var(--muted); }
.res-teams > span.win { color: var(--ink); }
.res-teams b { margin-left: auto; padding-left: 14px; font-size: 24px; font-variant-numeric: tabular-nums; }
.res-tag { grid-area: tag; align-self: start; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; letter-spacing: 0.08em; color: var(--muted); padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; }
.res-star { grid-area: star; display: flex; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 15px; }
.res-star > span { display: flex; flex-direction: column; line-height: 1.2; }
.res-star-name { font-weight: 600; }
.res-star-adj { font-size: 14px; font-variant-numeric: tabular-nums; }
.lead-list { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 12px 30px -20px rgba(10, 31, 61, 0.5); overflow: hidden; }
.lead { display: flex; align-items: center; gap: 12px; padding: 10px 18px; color: var(--ink); text-decoration: none; cursor: pointer; border-bottom: 1px solid var(--line); }
.lead:last-child { border-bottom: 0; }
.lead:nth-child(even) { background: var(--stripe); }
.lead:hover { background: var(--crease); }
.lead .avatar { margin-right: 0; }
.lead-n { width: 1.2em; text-align: center; color: var(--muted); font-size: 14px; }
.lead-who { display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.25; }
.lead-name { font-weight: 600; font-size: 16px; }
.lead-team { color: var(--muted); font-size: 14px; }
.lead-val { text-align: right; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.lead-val small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 400; }
@media (max-width: 480px) { .res-grid { grid-template-columns: 1fr; } }
/* team game log */
.glog { min-width: 1850px; }
.glog .gl-group th { background: color-mix(in srgb, var(--board) 82%, var(--accent)); text-align: center; letter-spacing: 0.08em; font-size: 12px; padding: 7px 10px; border-left: 1px solid rgba(255, 255, 255, 0.18); }
.glog thead th, .glog td { white-space: nowrap; }
.glog td.gl-date, .glog th:nth-child(1) { position: sticky; left: 0; z-index: 2; min-width: 110px; background-color: var(--surface); }
.glog td.gl-opp, .glog th:nth-child(2) { position: sticky; left: 110px; z-index: 2; min-width: 110px; background-color: var(--surface); box-shadow: 6px 0 8px -6px rgba(10, 31, 61, 0.35); }
.glog thead th:nth-child(1), .glog thead th:nth-child(2) { background-color: var(--board); z-index: 4; }
.glog .gl-group th:nth-child(1), .glog .gl-group th:nth-child(2) { position: static; box-shadow: none; }
.glog tbody tr:nth-child(even) td.gl-date, .glog tbody tr:nth-child(even) td.gl-opp { background-image: linear-gradient(var(--stripe), var(--stripe)); }
.glog tr.gl-total td { font-weight: 700; border-top: 2px solid var(--ink); background-color: var(--rail); }
.glog tr.gl-total td.gl-date, .glog tr.gl-total td:first-child { position: static; }
.gl-sc { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.gl-unit { display: inline-flex; align-items: center; }
.glog .faces .avatar { width: 28px; height: 28px; line-height: 28px; }
.res-chip { display: inline-block; min-width: 38px; text-align: center; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--rail); color: var(--ink); }
.res-chip.w { background: var(--good); color: var(--surface); }
.res-chip.l { background: color-mix(in srgb, var(--bad) 45%, var(--surface)); color: var(--ink); }
.res-chip.o { background: color-mix(in srgb, var(--muted) 40%, var(--surface)); }
.team-head .detail-title { font-size: clamp(28px, 5vw, 46px); }
/* glossary */
.gloss dl { margin: 0; }
.gloss dt { font-weight: 800; font-size: 17px; margin: 16px 0 2px; }
.gloss dd { margin: 0; max-width: 76ch; color: var(--muted); font-size: 16px; line-height: 1.55; }

/* hover definitions for the stats that need one */
.has-tip { text-decoration: underline dotted; text-decoration-color: color-mix(in srgb, currentColor 55%, transparent); text-underline-offset: 4px; text-decoration-thickness: 1.5px; cursor: help; }
th.sortable.has-tip { cursor: pointer; }
.def-tip { position: fixed; z-index: 1000; max-width: min(320px, calc(100vw - 16px)); padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--surface); font-family: var(--font-body); font-size: 14px; font-weight: 400; line-height: 1.45; letter-spacing: 0; text-transform: none; text-align: left; white-space: normal; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35); pointer-events: none; }
.def-tip[hidden] { display: none; }

  .panel-title, .board-title { font-size: 29px; }

.season-total td { border-top: 1px solid var(--line, #d9e1e4); }

.gv-mupick { margin: 4px 0 10px; }
table.auto-sort thead tr:last-child th { cursor: pointer; user-select: none; }

.sort-arrow { margin-left: 4px; font-size: 11px; opacity: .85; }
.pc-actions { margin: 10px 0 2px; }
/* site search: in the bottom-right corner of the header, just above the tabs (the tabs pill overlaps the header's bottom edge, so this row takes no space of its own) */

.site-search { width: 100%; box-sizing: border-box; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.12); color: var(--board-ink, #fff); font: 500 13.5px var(--font-body); }

.search-results { position: absolute; z-index: 60; top: calc(100% + 6px); right: 0; width: min(380px, 88vw); max-height: 70vh; overflow-y: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28); padding: 6px; }
.sr-h { font: 700 11px var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
.sr-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--ink); text-decoration: none; }
.sr-item:hover, .sr-item.on { background: var(--rail); } .sr-name { font-weight: 600; } .sr-meta { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.sr-none { padding: 14px 10px; color: var(--muted); font-size: 14px; }
/* game preview */
.pred-bar { display: flex; height: 38px; border-radius: 10px; overflow: hidden; font-weight: 800; color: #fff; }
.pred-bar span { display: flex; align-items: center; padding: 0 12px; white-space: nowrap; overflow: hidden; }
.pred-a { background: #4a6785; } .pred-h { background: var(--red, #d8433a); justify-content: flex-end; }

.pv-head { margin: 4px 0 8px; }

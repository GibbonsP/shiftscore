name: Update site

# Ingest finished games, rebuild the site and deploy it to Cloudflare Pages. Runs every two hours by day and every ten minutes from
# 22:00 to 07:59 UTC (5 pm to 3 am Eastern, when games finish), so a finished game's cards are on the site, and in subscribers' inboxes,
# soon after it is processed. A scheduled run deploys only when it ingested a new game, plus the first run of each even UTC hour (the
# schedule and scores on the page age, so those refresh every two hours); a manual run always deploys. Setup steps are in DEPLOY.md.
on:
  schedule:
    - cron: "7 8-20/2 * * *"
    - cron: "7,17,27,37,47,57 22-23,0-7 * * *"   # every 10 minutes at game time: GitHub drops or delays some runs, so ask often (odd minutes avoid the busy :00 and :30)
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Rebuild every season's data files from the stored database (do this after a change to what the data files contain)"
        type: boolean
        default: false
      only_if_new:
        description: "Deploy only if a new game came in (what the live loop asks for when a game ends)"
        type: boolean
        default: false

concurrency:
  group: site-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # a ten-second check first: at night with no game in progress or just finished, the real job is skipped
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      work: ${{ steps.gate.outputs.work }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python ci/gate.py

  update:
    needs: gate
    if: needs.gate.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
      SITE_URL: ${{ vars.SITE_URL }}
      LIVE_URL: ${{ vars.LIVE_URL }}
      EMAIL_SIGNUP: ${{ vars.EMAIL_SIGNUP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Restore state (database and last build)
        run: python ci/state.py pull

      - name: Full rebuild of every season (only when asked for)
        if: inputs.full_rebuild
        run: python build_artifact.py

      - name: Ingest finished games and rebuild
        id: update
        run: python ci/run_update.py

      - name: Assemble the site
        run: python build_site.py

      - name: Deploy to Cloudflare Pages
        if: (github.event_name != 'schedule' && !inputs.only_if_new) || steps.update.outputs.updated == 'true' || steps.update.outputs.slot == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: Save state (when new games were ingested or after a full rebuild)
        if: steps.update.outputs.updated == 'true' || inputs.full_rebuild
        run: python ci/state.py push

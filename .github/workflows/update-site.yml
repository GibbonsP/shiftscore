name: Update site

# Ingest finished games, rebuild the site and deploy it to Cloudflare Pages. Runs every two hours by day and every half hour from
# 22:00 to 07:59 UTC (5 pm to 3 am Eastern, when games finish), so a finished game's cards are on the site, and in subscribers' inboxes,
# soon after it is processed. A scheduled run deploys only when it ingested a new game, plus the first run of each even UTC hour (the
# schedule and scores on the page age, so those refresh every two hours); a manual run always deploys. Setup steps are in DEPLOY.md.
on:
  schedule:
    - cron: "17 8-20/2 * * *"
    - cron: "17,47 22-23,0-7 * * *"
  workflow_dispatch:

concurrency:
  group: site-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
      SITE_URL: ${{ vars.SITE_URL }}
      LIVE_URL: ${{ vars.LIVE_URL }}
      EMAIL_SIGNUP: ${{ vars.EMAIL_SIGNUP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Restore state (database and last build)
        run: python ci/state.py pull

      - name: Ingest finished games and rebuild
        id: update
        run: python ci/run_update.py

      - name: Assemble the site
        run: python build_site.py

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'schedule' || steps.update.outputs.updated == 'true' || steps.update.outputs.slot == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: Save state (only when new games were ingested)
        if: steps.update.outputs.updated == 'true'
        run: python ci/state.py push

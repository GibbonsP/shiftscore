name: Live scores

# Runs the live scorer on game nights: every minute while games are in play it rebuilds them and copies the result to the
# public live bucket, which the site polls. Two starts per night (a job is limited to 6 hours) and a weekend-afternoon start.
# It stops by itself when no game is in play or about to start. Setup steps are in DEPLOY.md.
on:
  schedule:
    - cron: "50 21 * * *"        # 5:50 pm Eastern (4:50 pm in winter): covers the evening start
    - cron: "5 3 * * *"          # 11:05 pm Eastern: the late games
    - cron: "40 16 * * 0,6"      # weekend afternoons
  workflow_dispatch:

concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_LIVE_BUCKET: ${{ vars.R2_LIVE_BUCKET }}
      R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt boto3
      - name: Restore the private scoring constants
        run: python ci/state.py pull-private
      - run: python ci/live_loop.py

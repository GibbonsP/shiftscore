name: Send cards

# Emails each subscriber the cards for their teams' games as soon as the site has them: it runs after every site update, finds the
# subscribers with new cards waiting, and sends each one email (a run with nothing new does nothing and costs a few seconds).
# Setup steps are in DEPLOY.md, "Email cards".
on:
  workflow_run:
    workflows: ["Update site"]
    types: [completed]
  schedule:
    - cron: "30 12 * * *"        # a daily catch-up, in case a run was missed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but send nothing"
        type: boolean
        default: false

concurrency:
  group: send-cards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_POSTAL: ${{ vars.EMAIL_POSTAL }}
      LIVE_URL: ${{ vars.LIVE_URL }}
      R2_LIVE_BUCKET: ${{ vars.R2_LIVE_BUCKET }}
      SEND_SECRET: ${{ secrets.SEND_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DRY: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Is anything waiting to be sent?
        id: check
        run: python ci/send_cards.py --check-only
      - name: Install the browser and uploader
        if: steps.check.outputs.pending == 'true'
        run: |
          pip install boto3 playwright
          python -m playwright install --with-deps chromium
      - name: Send the cards
        if: steps.check.outputs.pending == 'true'
        run: |
          args=""
          if [ "$DRY" = "true" ]; then args="--dry-run"; fi
          python ci/send_cards.py $args
